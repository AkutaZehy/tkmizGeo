<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometric Bloom</title>
<style>
:root{
  --bg:#0f1114; --panel:#171a1f; --line:#2a2f37; --fg:#d9dde3; --mute:#7c8592; --acc:#7fb3ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex}
#side{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 16px 24px}
#main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
canvas{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line)}
h1{font-size:15px;margin:0 0 12px;letter-spacing:.06em}
h2{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;margin:18px 0 8px;border-top:1px solid var(--line);padding-top:12px}
.row{display:grid;grid-template-columns:1fr 70px;gap:6px;align-items:center;margin:5px 0}
.row label{color:var(--fg)}
.row input[type=range]{grid-column:1/3;width:100%}
.val{text-align:right;color:var(--acc);font-variant-numeric:tabular-nums}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}
input[type=number],input[type=text],select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:4px 6px;border-radius:3px}
input[type=color]{width:100%;height:26px;background:none;border:1px solid var(--line);padding:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
button{background:var(--line);color:var(--fg);border:0;padding:9px;border-radius:3px;cursor:pointer;font:inherit}
button.pri{background:var(--acc);color:#0b1220;font-weight:600}
button:hover{filter:brightness(1.15)}
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
#stat{color:var(--mute);margin-top:10px;font-variant-numeric:tabular-nums}
@media (max-width:760px){body{flex-direction:column}#side{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:50vh}}
</style>
</head>
<body>
<div id="side">
  <h1>GEOMETRIC BLOOM</h1>
  <div class="btns">
    <button class="pri" id="gen">生成</button>
    <button id="dl">PNG保存</button>
  </div>
  <div class="row"><label>シード</label><span></span>
    <input type="text" id="seed" style="grid-column:1/3"></div>
  <div class="chk"><input type="checkbox" id="lockSeed"><label for="lockSeed">シード固定（設定変更のみ反映）</label></div>

  <h2>キャンバス</h2>
  <div class="row"><label>幅</label><input type="number" id="W" value="1600" min="64" max="8000"></div>
  <div class="row"><label>高さ</label><input type="number" id="H" value="1600" min="64" max="8000"></div>

  <h2>上限</h2>
  <div class="row"><label>図形の最大数</label><span class="val" id="v_maxNodes"></span><input type="range" id="maxNodes" min="1" max="5000" value="60"></div>
  <div class="row"><label>線の最大数（全体）</label><span class="val" id="v_maxLines"></span><input type="range" id="maxLines" min="0" max="10000" value="120"></div>
  <div class="row"><label>1図形からの線 最大</label><span class="val" id="v_branchMax"></span><input type="range" id="branchMax" min="0" max="100" value="7"></div>
  <div class="row"><label>1図形からの線 最小</label><span class="val" id="v_branchMin"></span><input type="range" id="branchMin" min="0" max="100" value="2"></div>
  <div class="row"><label>最大深さ（世代）</label><span class="val" id="v_maxDepth"></span><input type="range" id="maxDepth" min="0" max="40" value="4"></div>
  <div class="row"><label>同心円の最大重ね数</label><span class="val" id="v_maxRings"></span><input type="range" id="maxRings" min="1" max="50" value="5"></div>

  <h2>サイズ</h2>
  <div class="row"><label>中央円 半径 最小</label><span class="val" id="v_rootMin"></span><input type="range" id="rootMin" min="10" max="1500" value="60"></div>
  <div class="row"><label>中央円 半径 最大</label><span class="val" id="v_rootMax"></span><input type="range" id="rootMax" min="10" max="2000" value="180"></div>
  <div class="row"><label>子図形 半径 最小</label><span class="val" id="v_rMin"></span><input type="range" id="rMin" min="1" max="800" value="12"></div>
  <div class="row"><label>子図形 半径 最大</label><span class="val" id="v_rMax"></span><input type="range" id="rMax" min="1" max="1200" value="70"></div>
  <div class="row"><label>世代ごとの縮小率 %</label><span class="val" id="v_shrink"></span><input type="range" id="shrink" min="30" max="100" value="75"></div>
  <div class="row"><label>線の長さ 最小</label><span class="val" id="v_lenMin"></span><input type="range" id="lenMin" min="1" max="3000" value="60"></div>
  <div class="row"><label>線の長さ 最大</label><span class="val" id="v_lenMax"></span><input type="range" id="lenMax" min="1" max="4000" value="260"></div>

  <h2>確率</h2>
  <div class="row"><label>線の先に図形を置く %</label><span class="val" id="v_pNode"></span><input type="range" id="pNode" min="0" max="100" value="70"></div>
  <div class="row"><label>図形から更に線を伸ばす %</label><span class="val" id="v_pBranch"></span><input type="range" id="pBranch" min="0" max="100" value="65"></div>
  <div class="row"><label>線の終端に点 %</label><span class="val" id="v_pDot"></span><input type="range" id="pDot" min="0" max="100" value="40"></div>
  <div class="row"><label>角度の等間隔度 %</label><span class="val" id="v_regular"></span><input type="range" id="regular" min="0" max="100" value="50"></div>

  <h2>図形の種類</h2>
  <div class="shapes">
    <label class="chk"><input type="checkbox" id="s_circle" checked>円</label>
    <label class="chk"><input type="checkbox" id="s_rings" checked>多重円</label>
    <label class="chk"><input type="checkbox" id="s_semi" checked>半円</label>
    <label class="chk"><input type="checkbox" id="s_mix" checked>円＋半円ミックス</label>
    <label class="chk"><input type="checkbox" id="s_square" checked>正方形</label>
    <label class="chk"><input type="checkbox" id="s_dsq" checked>二重正方形</label>
  </div>

  <h2>重なり</h2>
  <label class="chk"><input type="checkbox" id="noOverlap" checked>線の先に既存の図形があれば重ねない</label>
  <div class="row"><label>重なり時の動作</label><span></span>
    <select id="overlapMode" style="grid-column:1/3">
      <option value="retry">角度を変えて再試行</option>
      <option value="line">線だけ引く（図形は置かない）</option>
      <option value="skip">線ごと取りやめ</option>
    </select></div>
  <div class="row"><label>図形間の余白</label><span class="val" id="v_gap"></span><input type="range" id="gap" min="0" max="400" value="8"></div>
  <label class="chk"><input type="checkbox" id="lineAvoid">線が既存図形を横切らない</label>
  <label class="chk"><input type="checkbox" id="inBounds" checked>キャンバス内に収める</label>

  <h2>スタイル</h2>
  <div class="row"><label>背景色</label><input type="color" id="bgc" value="#0e0f12"></div>
  <label class="chk"><input type="checkbox" id="transparent">背景透過（PNG）</label>
  <div class="row"><label>線の色</label><input type="color" id="fgc" value="#e8e4da"></div>
  <div class="row"><label>アクセント色</label><input type="color" id="acc" value="#d9a441"></div>
  <div class="row"><label>アクセント率 %</label><span class="val" id="v_pAcc"></span><input type="range" id="pAcc" min="0" max="100" value="15"></div>
  <div class="row"><label>線の太さ</label><span class="val" id="v_lw"></span><input type="range" id="lw" min="0.25" max="40" step="0.25" value="2"></div>
  <div class="row"><label>塗りつぶし率 %</label><span class="val" id="v_pFill"></span><input type="range" id="pFill" min="0" max="100" value="10"></div>
  <label class="chk"><input type="checkbox" id="lineFromEdge" checked>線を図形の縁から出す</label>
  <div id="stat"></div>
</div>
<div id="main"><canvas id="cv"></canvas></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const ranges=[...document.querySelectorAll('input[type=range]')];
ranges.forEach(r=>{const v=$('v_'+r.id);const f=()=>v&&(v.textContent=r.value);f();r.addEventListener('input',f)});

// seeded RNG (mulberry32)
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const rnd=(a,b)=>a+R()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(R()*a.length)];

function cfg(){
  const n=id=>+$(id).value, c=id=>$(id).checked;
  const o={W:Math.min(8000,Math.max(64,n("W"))),H:Math.min(8000,Math.max(64,n("H"))),maxNodes:n('maxNodes'),maxLines:n('maxLines'),
    branchMin:n('branchMin'),branchMax:n('branchMax'),maxDepth:n('maxDepth'),maxRings:n('maxRings'),
    rootMin:n('rootMin'),rootMax:n('rootMax'),rMin:n('rMin'),rMax:n('rMax'),shrink:n('shrink')/100,
    lenMin:n('lenMin'),lenMax:n('lenMax'),pNode:n('pNode')/100,pBranch:n('pBranch')/100,pDot:n('pDot')/100,
    regular:n('regular')/100,noOverlap:c('noOverlap'),overlapMode:$('overlapMode').value,gap:n('gap'),
    lineAvoid:c('lineAvoid'),inBounds:c('inBounds'),bg:$('bgc').value,transparent:c('transparent'),
    fg:$('fgc').value,acc:$('acc').value,pAcc:n('pAcc')/100,lw:n('lw'),pFill:n('pFill')/100,lineFromEdge:c('lineFromEdge'),
    shapes:['circle','rings','semi','mix','square','dsq'].filter(s=>c('s_'+s))};
  const sw=(a,b)=>{if(o[a]>o[b])[o[a],o[b]]=[o[b],o[a]]};
  sw('branchMin','branchMax');sw('rootMin','rootMax');sw('rMin','rMax');sw('lenMin','lenMax');
  if(!o.shapes.length)o.shapes=['circle'];
  return o;
}

// 図形の外接円半径で衝突判定
function overlaps(nodes,x,y,r,gap,ignore){
  for(const n of nodes){if(n===ignore)continue;if(Math.hypot(n.x-x,n.y-y)<n.r+r+gap)return true}
  return false;
}
function segHitsNode(nodes,x1,y1,x2,y2,skip){
  for(const n of nodes){
    if(skip.includes(n))continue;
    const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy||1;
    let t=((n.x-x1)*dx+(n.y-y1)*dy)/L;t=Math.max(0,Math.min(1,t));
    if(Math.hypot(x1+t*dx-n.x,y1+t*dy-n.y)<n.r)return true;
  }
  return false;
}

function makeNode(x,y,r,depth,o,forceCircle){
  const type=forceCircle?(R()<.5?'circle':'rings'):pick(o.shapes);
  const n={x,y,r,depth,type,rot:rnd(0,Math.PI*2),accent:R()<o.pAcc,fill:R()<o.pFill};
  if(type==='rings'||type==='mix'){
    const k=rint(2,Math.max(2,o.maxRings));
    n.rings=[];for(let i=0;i<k;i++)n.rings.push(r*(1-i/k*rnd(.85,1)));
    if(type==='mix')n.semis=n.rings.map(()=>R()<.55?{a:rnd(0,Math.PI*2),span:pick([Math.PI,Math.PI,Math.PI/2,Math.PI*1.5])}:null);
  }
  if(type==='semi'){n.flat=R()<.6}
  if(type==='square'||type==='dsq'){n.rot=pick([0,Math.PI/4,rnd(0,Math.PI/2)])}
  return n;
}

function generate(o){
  const nodes=[],lines=[],dots=[];
  const cx=o.W/2,cy=o.H/2;
  const root=makeNode(cx,cy,rnd(o.rootMin,o.rootMax),0,o,true);
  nodes.push(root);
  const queue=[root];let qi=0;
  while(qi<queue.length&&nodes.length<o.maxNodes&&lines.length<o.maxLines){
    const p=queue[qi++];
    if(p.depth>=o.maxDepth)continue;
    if(p!==root&&R()>o.pBranch)continue;
    const cnt=rint(o.branchMin,o.branchMax);
    const base=rnd(0,Math.PI*2);
    for(let i=0;i<cnt;i++){
      if(lines.length>=o.maxLines)break;
      const regA=base+i/cnt*Math.PI*2;
      let placed=false;
      const tries=o.noOverlap&&o.overlapMode==='retry'?14:1;
      for(let t=0;t<tries&&!placed;t++){
        const jitter=(1-o.regular)*Math.PI*(t?1:.5);
        const a=(t?rnd(0,Math.PI*2):regA)+rnd(-jitter,jitter);
        const sc=Math.pow(o.shrink,p.depth);
        const len=rnd(o.lenMin,o.lenMax)*sc;
        const sx=p.x+Math.cos(a)*(o.lineFromEdge?p.r:0),sy=p.y+Math.sin(a)*(o.lineFromEdge?p.r:0);
        let wantNode=nodes.length<o.maxNodes&&R()<o.pNode;
        const cr=rnd(o.rMin,o.rMax)*sc;
        const dist=p.r+len+(wantNode?cr:0);
        const ex=p.x+Math.cos(a)*dist,ey=p.y+Math.sin(a)*dist;
        const lx=p.x+Math.cos(a)*(p.r+len),ly=p.y+Math.sin(a)*(p.r+len);
        const margin=wantNode?cr:4;
        if(o.inBounds&&(ex<margin||ey<margin||ex>o.W-margin||ey>o.H-margin))continue;
        if(o.lineAvoid&&segHitsNode(nodes,sx,sy,lx,ly,[p]))continue;
        if(wantNode&&o.noOverlap&&overlaps(nodes,ex,ey,cr,o.gap,null)){
          if(o.overlapMode==='retry')continue;
          if(o.overlapMode==='skip'){placed=true;break}
          wantNode=false; // line only
        }
        // 線だけの場合も終端が既存図形内なら重ねない
        if(!wantNode&&o.noOverlap&&overlaps(nodes,lx,ly,2,0,p)){
          if(o.overlapMode==='retry')continue;
          placed=true;break;
        }
        const accent=R()<o.pAcc;
        if(wantNode){
          const n=makeNode(ex,ey,cr,p.depth+1,o);
          lines.push({x1:sx,y1:sy,x2:ex-Math.cos(a)*(o.lineFromEdge?cr:0),y2:ey-Math.sin(a)*(o.lineFromEdge?cr:0),accent});
          nodes.push(n);queue.push(n);
        }else{
          lines.push({x1:sx,y1:sy,x2:lx,y2:ly,accent});
          if(R()<o.pDot)dots.push({x:lx,y:ly,r:Math.max(2,o.lw*rnd(1.5,3)),accent});
        }
        placed=true;
      }
    }
  }
  return {nodes,lines,dots};
}

function draw(o,g){
  cv.width=o.W;cv.height=o.H;
  ctx.clearRect(0,0,o.W,o.H);
  if(!o.transparent){ctx.fillStyle=o.bg;ctx.fillRect(0,0,o.W,o.H)}
  ctx.lineCap='round';ctx.lineJoin='round';
  const col=a=>a?o.acc:o.fg;
  for(const l of g.lines){
    ctx.strokeStyle=col(l.accent);ctx.lineWidth=o.lw;
    ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
  }
  for(const d of g.dots){ctx.fillStyle=col(d.accent);ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()}
  for(const n of g.nodes){
    const c=col(n.accent);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=o.lw;
    ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.rot);
    const finish=()=>{if(n.fill){ctx.globalAlpha=.9;ctx.fill();ctx.globalAlpha=1}ctx.stroke()};
    switch(n.type){
      case'circle':ctx.beginPath();ctx.arc(0,0,n.r,0,Math.PI*2);finish();
        ctx.beginPath();ctx.arc(0,0,Math.max(1.5,o.lw*1.2),0,Math.PI*2);ctx.fill();break;
      case'rings':n.rings.forEach((r,i)=>{ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);if(i===n.rings.length-1&&n.fill)ctx.fill();ctx.stroke()});break;
      case'semi':ctx.beginPath();ctx.arc(0,0,n.r,0,Math.PI);if(n.flat)ctx.closePath();finish();break;
      case'mix':n.rings.forEach((r,i)=>{const s=n.semis[i];ctx.beginPath();
        if(s){ctx.arc(0,0,r,s.a,s.a+s.span);}else ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke()});
        if(n.fill){ctx.beginPath();ctx.arc(0,0,n.rings[n.rings.length-1],0,Math.PI);ctx.closePath();ctx.fill()}break;
      case'square':{const s=n.r/Math.SQRT2;ctx.beginPath();ctx.rect(-s,-s,s*2,s*2);finish();break}
      case'dsq':{const s=n.r/Math.SQRT2;ctx.beginPath();ctx.rect(-s,-s,s*2,s*2);finish();
        const s2=s*.6;ctx.rotate(Math.PI/4);ctx.beginPath();ctx.rect(-s2,-s2,s2*2,s2*2);ctx.stroke();break}
    }
    ctx.restore();
  }
  $('stat').textContent=`図形 ${g.nodes.length} / 線 ${g.lines.length} / 点 ${g.dots.length}`;
}

function run(newSeed){
  if(newSeed&&!$('lockSeed').checked)$('seed').value=Math.random().toString(36).slice(2,10);
  R=mulberry(hashStr($('seed').value||'0'));
  const o=cfg();draw(o,generate(o));
}
$('gen').onclick=()=>run(true);
document.querySelectorAll('#side input,#side select').forEach(el=>{
  if(el.id==='seed'||el.id==='lockSeed')return;
  el.addEventListener('change',()=>run(false));
});
$('seed').addEventListener('change',()=>run(false));
$('dl').onclick=()=>{
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=`geometric_${$('seed').value}.png`;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)},'image/png');
};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();run(true)}});
run(true);
</script>
</body>
</html>
